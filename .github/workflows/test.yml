name: Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Чек-аут репозитория
        uses: actions/checkout@v3

      - name: Настройка Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic

      - name: Запуск тестов Таблиц 3 и 4 (Универсальные вагоны)
        run: |
          python -m pytest tests/test_full_calculation.py -v -s

      - name: Запуск тестов Таблицы 5 (Специализированный подвижной состав)
        run: |
          python -m pytest tests/test_table_5_full.py -v -s
      
      - name: Запуск тестов Таблицы 6 (Наливные грузы в цистернах)
        run: |
          pytest tests/test_table_6.py
